name: edit-n2n
tag: edit
exp_root_dir: /home/tirtho/Desktop/Research/external/SAGE-Extend/results/pilot/Tomato__Leaf_Mold__0092/F/_ge
seed: 0
data_type: gs-load
data:
  batch_size: 1
  source: /home/tirtho/Desktop/Research/external/SAGE-Extend/results/pilot/Tomato__Leaf_Mold__0092/D
  max_view_num: 96
  eval_camera_distance: 4.0
  camera_distance_range:
  - 1.5
  - 4.0
  light_sample_strategy: dreamfusion3dgs
  height: 512
  width: 512
  elevation_view_num: 2
  azimuth_view_num: 8
system_type: gsedit-system-edit
system:
  gs_source: /home/tirtho/Desktop/Research/external/SAGE-Extend/results/pilot/sam3d/Tomato__Leaf_Mold__0092/seed0/splat_ge.ply
  per_editing_step: 10
  edit_begin_step: 0
  densify_until_iter: 1501
  densify_from_iter: 100
  densification_interval: 100
  max_grad: 5
  min_opacity: 0.005
  prompt_processor_type: stable-diffusion-prompt-processor
  prompt_processor:
    pretrained_model_name_or_path: runwayml/stable-diffusion-v1-5
    prompt: 'make this tomato leaf show leaf mold: olive-green to brown velvety mold
      forms on the lower leaf surface below leaf spots; pale greenish-yellow spots,
      usually less than 1/4 inch, with no definite margins, form on the upper sides
      of leaves'
  guidance_type: stable-diffusion-instructpix2pix-guidance
  guidance:
    min_step_percent: 0.02
    max_step_percent: 0.98
    guidance_scale: 7.5
    condition_scale: 1.5
  loggers:
    wandb:
      enable: false
      project: threestudio_gs
      name: None
  loss:
    lambda_sparsity: 0.0
    lambda_opaque: 0.0
    lambda_l1: 10.0
    lambda_p: 10.0
    lambda_dds: 0.0
    lambda_anchor_color: 0
    lambda_anchor_geo: 50
    lambda_anchor_opacity: 50
    lambda_anchor_scale: 50
    lambda_move: 0
    lambda_alpha: 0
    lambda_scale: 0
  optimizer:
    name: Adam
    args:
      lr: 0.001
      betas:
      - 0.9
      - 0.99
      eps: 1.0e-15
  max_densify_percent: 0.01
  anchor_weight_init_g0: 0.05
  anchor_weight_init: 0.1
  anchor_weight_multiplier: 1.3
  gs_lr_scaler: 5
  gs_final_lr_scaler: 5
  color_lr_scaler: 5
  opacity_lr_scaler: 2
  scaling_lr_scaler: 2
  rotation_lr_scaler: 2
trainer:
  max_steps: 200
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 20
  enable_progress_bar: true
  precision: 16-mixed
checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
